syntax = "proto3";

package gloski.agent.v1;

option go_package = "github.com/ss497254/gloski/proto/agentv1;agentv1";

// Agent exposes one long-lived bidirectional stream per device. The master
// sends commands; the agent sends registration, stats, and results.
service Agent {
  rpc Connect(stream AgentMessage) returns (stream MasterMessage);
}

message AgentMessage {
  // request_id correlates replies and streaming chunks with master commands.
  string request_id = 1;
  oneof payload {
    RegisterRequest register = 2;
    Heartbeat heartbeat = 3;
    JobOutput job_output = 4;
    JobResult job_result = 5;
    FileResult file_result = 6;
    TerminalOutput terminal_output = 7;
    ProcessResult process_result = 8;
  }
}

message MasterMessage {
  string request_id = 1;
  oneof payload {
    RegisterResponse register_response = 2;
    RunJob run_job = 3;
    CancelRequest cancel = 4;
    FileRequest file_request = 5;
    TerminalOpen terminal_open = 6;
    TerminalInput terminal_input = 7;
    TerminalClose terminal_close = 8;
    Shutdown shutdown = 9;
    ProcessRequest process_request = 10;
    JobAck job_ack = 11;
    TerminalResize terminal_resize = 12;
    FileTransfer file_transfer = 13;
  }
}

// FileTransfer moves file contents over plain HTTP on the agent port instead
// of the gRPC stream. The stream only says what to move; the bytes never share
// the terminal and job lanes.
message FileTransfer {
  // transfer_id is a one-time id. The agent presents it on
  // /agent/transfer/{transfer_id} to fetch or deliver the bytes.
  string transfer_id = 1;
  FileTransferDirection direction = 2;
  string path = 3;
  // offset and length select a range; length 0 means to the end of the file.
  int64 offset = 4;
  int64 length = 5;
}

enum FileTransferDirection {
  FILE_TRANSFER_DIRECTION_UNSPECIFIED = 0;
  // UPLOAD: the master has the bytes and the agent fetches them.
  FILE_TRANSFER_DIRECTION_UPLOAD = 1;
  // DOWNLOAD: the master wants the bytes and the agent sends them.
  FILE_TRANSFER_DIRECTION_DOWNLOAD = 2;
}

message ProcessRequest {
  int32 limit = 1;
  string sort = 2;
}

message ProcessResult {
  string json = 1;
}

message RegisterRequest {
  string join_token = 1;
  string name = 2;
  string hostname = 3;
  string platform = 4;
  string version = 5;
  string deploy_id = 6;
  bool master = 7;
  string stats_json = 8;
  // jobs lists every job this agent still holds: running ones, and finished
  // ones whose result the master has not acknowledged.
  repeated JobState jobs = 9;
  // machine_id identifies the machine (not the agent process) so the master
  // can tell a reconnect from a second machine using the same name.
  string machine_id = 10;
  // arch and build_hash describe the agent binary, so the master can tell when
  // a device runs a different build from the one it would install.
  string arch = 11;
  string build_hash = 12;
  // protocol is agentv1.ProtocolVersion. The master refuses any other value
  // and the agent then exits, leaving the master to install the right build.
  int32 protocol = 13;
}

message RegisterResponse {
  string device_id = 1;
  string device_token = 2;
  int32 heartbeat_interval = 3;
  string master_version = 4;
  // jobs answers RegisterRequest.jobs, one entry per reported job.
  repeated JobResume jobs = 5;
}

// JobState is the agent's view of one job when it (re)connects.
message JobState {
  string id = 1;
  // last_seq is the sequence number of the newest output chunk produced.
  uint64 last_seq = 2;
  bool finished = 3;
  int32 exit_code = 4;
  string error = 5;
}

// JobResume tells the agent where to pick a job back up.
message JobResume {
  string id = 1;
  // acked_seq is the newest output chunk the master has stored; the agent
  // resends everything after it.
  uint64 acked_seq = 2;
  // forget means the master no longer tracks this job: stop it and drop it.
  bool forget = 3;
}

message Heartbeat {
  string stats_json = 1;
}

message RunJob {
  string command = 1;
  string cwd = 2;
}

message CancelRequest {
  string reason = 1;
}

message JobOutput {
  bytes chunk = 1;
  bool stderr = 2;
  // seq numbers a job's chunks from 1 so the master can drop duplicates and
  // notice gaps after a reconnect. 0 means unsequenced (agents before this
  // field existed).
  uint64 seq = 3;
}

// JobAck confirms the master stored a job's result, so the agent can drop it.
message JobAck {}

message JobResult {
  int32 exit_code = 1;
  string error = 2;
}

enum FileOp {
  FILE_OP_UNSPECIFIED = 0;
  FILE_OP_LIST = 1;
  FILE_OP_READ = 2;
  FILE_OP_WRITE = 3;
  FILE_OP_DELETE = 4;
  FILE_OP_MKDIR = 5;
  FILE_OP_RENAME = 6;
  // STAT describes a file before the master starts a download transfer.
  FILE_OP_STAT = 7;
  // 8 and 9 were the READ_AT and WRITE_AT piece operations; file contents now
  // use FileTransfer over HTTP.
  reserved 8, 9;
}

message FileRequest {
  FileOp op = 1;
  string path = 2;
  bytes content = 3;
  string new_path = 4;
  // 5 to 7 belonged to the removed piece operations.
  reserved 5, 6, 7;
}

message FileResult {
  int32 code = 1;
  string message = 2;
  bytes content = 3;
  string entries_json = 4;
  // size, mod_time_unix and is_dir describe the file for STAT and READ_AT.
  int64 size = 5;
  int64 mod_time_unix = 6;
  bool is_dir = 7;
}

message TerminalOpen {
  string cwd = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

message TerminalInput {
  bytes data = 1;
}

message TerminalClose {}

message TerminalResize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message TerminalOutput {
  bytes data = 1;
  bool closed = 2;
}

message Shutdown {
  bool restart = 1;
  // uninstall removes the agent and its files from the device.
  bool uninstall = 2;
}
